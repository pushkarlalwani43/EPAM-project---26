<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vault One Bank</title>
<style>
  :root{
    --navy:#0b1f3a; --gold:#d4af37; --bg:#f4f6f9; --card:#ffffff;
    --green:#1e8e5a; --red:#c0392b; --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:#1b2430;
  }
  header{
    background:linear-gradient(90deg,var(--navy),#123057);
    color:#fff; padding:18px 30px; display:flex; align-items:center; justify-content:space-between;
  }
  header .brand{display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; letter-spacing:.5px;}
  header .brand span.mark{
    width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  header .tag{font-size:12px; color:#cbd5e1;}
  main{max-width:900px;margin:30px auto;padding:0 20px;}
  .card{
    background:var(--card); border-radius:10px; padding:24px; margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
  }
  #welcomeMsg{font-size:18px;font-weight:600;color:var(--navy);}
  .btn{
    background:var(--navy); color:#fff; border:none; padding:10px 18px; border-radius:6px;
    cursor:pointer; font-size:14px; margin-right:10px;
  }
  .btn:hover{background:#123057;}
  .btn.green{background:var(--green);}
  .btn.green:hover{background:#166f46;}
  .btn.red{background:var(--red);}
  .btn.red:hover{background:#9c2d20;}
  label{display:block; margin-bottom:6px; font-size:13px; color:var(--muted);}
  input[type="text"], input[type="number"]{
    padding:9px 10px; border:1px solid #cbd5e1; border-radius:6px; width:220px; font-size:14px;
  }
  .form-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px;}
  .field{display:flex; flex-direction:column;}
  #txnMsg{margin-top:10px; font-size:14px; font-weight:600; display:none; padding:10px; border-radius:6px;}
  #txnMsg.success{display:block; background:#e6f4ea; color:var(--green);}
  #txnMsg.error{display:block; background:#fdecea; color:var(--red);}
  h2{color:var(--navy); margin-top:0;}
  table{width:100%; border-collapse:collapse; margin-top:10px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid #e5e7eb; font-size:14px;}
  th{color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;}
  .credit{color:var(--green); font-weight:700;}
  .debit{color:var(--red); font-weight:700;}
  .balance-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--navy); color:#fff; padding:16px 20px; border-radius:10px; margin-bottom:20px;
  }
  .balance-strip .amt{font-size:26px; font-weight:800; color:var(--gold);}
  footer{text-align:center; color:var(--muted); font-size:12px; margin:30px 0;}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">V1</span> Vault One Bank</div>
  <div class="tag">Trusted Digital Banking</div>
</header>

<main>

  <!-- Welcome message -->
  <div class="card">
    <p id="welcomeMsg">Loading...</p>
    <div class="balance-strip">
      <div>Available Balance</div>
      <div class="amt" id="balanceDisplay">₹0.00</div>
    </div>
  </div>

  <!-- Deposit / Withdraw -->
  <div class="card">
    <h2>Deposit / Withdraw</h2>
    <div class="form-row">
      <div class="field">
        <label for="txnAmount">Amount (₹)</label>
        <input type="number" id="txnAmount" placeholder="Enter amount" min="1">
      </div>
      <div class="field">
        <label for="txnDesc">Description (optional)</label>
        <input type="text" id="txnDesc" placeholder="e.g. Cash deposit">
      </div>
      <div>
        <button class="btn green" onclick="doTransaction('credit')">Deposit</button>
        <button class="btn red" onclick="doTransaction('debit')">Withdraw</button>
      </div>
    </div>
    <div id="txnMsg"></div>
  </div>

  <!-- Passbook / Transaction History -->
  <div class="card">
    <h2>Passbook — Transaction History</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Description</th><th>Type</th><th>Amount (₹)</th><th>Balance (₹)</th></tr>
      </thead>
      <tbody id="passbookBody">
        <!-- filled by JS -->
      </tbody>
    </table>
  </div>

</main>

<footer>© 2026 Vault One Bank. This is a demo project for JavaScript learning purposes only.</footer>

<script>
  // ---------- Welcome message ----------
  var customerName = "Pushkar Lalwani";
  document.getElementById("welcomeMsg").innerHTML =
    "Welcome back, " + customerName + "! Good to see you at Vault One Bank.";

  // ---------- Passbook data (most recent first) ----------
  var transactions = [
    { date: "2026-07-28", desc: "Salary Credit",       type: "credit", amount: 65000 },
    { date: "2026-07-26", desc: "Electricity Bill",    type: "debit",  amount: 2200  },
    { date: "2026-07-22", desc: "Grocery - Big Bazaar", type: "debit",  amount: 3450  },
    { date: "2026-07-10", desc: "ATM Withdrawal",       type: "debit",  amount: 5000  },
    { date: "2026-07-02", desc: "Interest Credit",      type: "credit", amount: 310   }
  ];

  var openingBalance = 60000; // balance before the oldest transaction above
  var currentBalance = 0;

  function computeBalances() {
    // chronological order (oldest first) to build running balance
    var chrono = transactions.slice().reverse();
    var running = openingBalance;
    var balances = [];
    for (var i = 0; i < chrono.length; i++) {
      running = chrono[i].type === "credit" ? running + chrono[i].amount : running - chrono[i].amount;
      balances.push(running);
    }
    balances.reverse(); // back to most-recent-first order
    currentBalance = balances.length ? balances[0] : openingBalance;
    return balances;
  }

  function renderPassbook() {
    var balances = computeBalances();
    var tbody = document.getElementById("passbookBody");
    var rows = "";

    for (var j = 0; j < transactions.length; j++) {
      var t = transactions[j];
      var sign = t.type === "credit" ? "+" : "-";
      var cssClass = t.type === "credit" ? "credit" : "debit";
      rows += "<tr>" +
        "<td>" + t.date + "</td>" +
        "<td>" + t.desc + "</td>" +
        "<td class='" + cssClass + "'>" + t.type.toUpperCase() + "</td>" +
        "<td class='" + cssClass + "'>" + sign + t.amount.toLocaleString("en-IN") + "</td>" +
        "<td>" + balances[j].toLocaleString("en-IN") + "</td>" +
        "</tr>";
    }
    tbody.innerHTML = rows;

    document.getElementById("balanceDisplay").textContent =
      "₹" + currentBalance.toLocaleString("en-IN") + ".00";
  }

  function todayStr() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }

  function showTxnMsg(text, isError) {
    var box = document.getElementById("txnMsg");
    box.textContent = text;
    box.className = isError ? "error" : "success";
  }

  function doTransaction(type) {
    var amountInput = document.getElementById("txnAmount");
    var descInput = document.getElementById("txnDesc");
    var amount = parseFloat(amountInput.value);

    if (!amount || amount <= 0) {
      showTxnMsg("Please enter a valid amount.", true);
      return;
    }

    if (type === "debit" && amount > currentBalance) {
      showTxnMsg("Insufficient balance for this withdrawal.", true);
      return;
    }

    var desc = descInput.value.trim();
    if (desc === "") {
      desc = type === "credit" ? "Cash Deposit" : "Cash Withdrawal";
    }

    // add newest transaction to the front of the list
    transactions.unshift({ date: todayStr(), desc: desc, type: type, amount: amount });

    renderPassbook();
    showTxnMsg(
      (type === "credit" ? "Deposit" : "Withdrawal") + " of ₹" + amount.toLocaleString("en-IN") + " successful.",
      false
    );

    amountInput.value = "";
    descInput.value = "";
  }

  renderPassbook();
</script>

</body>
</html>
